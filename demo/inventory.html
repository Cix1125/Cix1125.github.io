<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进销存管理系统 · Demo（服装小店）</title>
<style>
  :root{
    --bg:#0b0f14;--panel:#121821;--panel2:#0f1520;--line:#22303f;
    --tx:#e6edf3;--tx2:#9fb0c3;--tx3:#6d7f93;
    --acc:#4cc9f0;--acc2:#7c5cff;--ok:#37d399;--warn:#ffb020;--bad:#ff6b6b;
    --r:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.6 "Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--acc)}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:20}
  .top{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}
  .logo{font-weight:700;font-size:15.5px;letter-spacing:.2px}
  .logo span{color:var(--acc)}
  .sub{color:var(--tx3);font-size:12px;border-left:1px solid var(--line);padding-left:14px}
  .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--tx);
    border-radius:9px;padding:7px 13px;font-size:12.5px;transition:.15s}
  .btn:hover{border-color:#3a5068;transform:translateY(-1px)}
  .btn.p{background:linear-gradient(92deg,var(--acc),var(--acc2));color:#06121a;border:0;font-weight:600}
  .btn.s{padding:4px 10px;font-size:11.5px;border-radius:7px}
  .btn.d{color:var(--bad);border-color:rgba(255,107,107,.3)}
  .tabs{display:flex;gap:4px;padding-bottom:0;overflow-x:auto}
  .tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--tx2);
    padding:10px 15px;font-size:13.5px;white-space:nowrap}
  .tab:hover{color:var(--tx)}
  .tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
  main{padding:26px 0 70px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .kpi b{display:block;font-size:23px;letter-spacing:-.4px;margin-bottom:2px}
  .kpi span{font-size:12px;color:var(--tx3)}
  .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)} .kpi.acc b{color:var(--acc)}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .box h3{margin:0;padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--line);
    color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:8px}
  .box h3 .cnt{margin-left:auto;font-weight:400;color:var(--tx3);font-size:11.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--tx3);font-weight:500;font-size:11.5px;padding:9px 16px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 16px;border-bottom:1px solid rgba(34,48,63,.55);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:rgba(76,201,240,.035)}
  .num{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .t-ok{background:rgba(55,211,153,.13);color:var(--ok)}
  .t-warn{background:rgba(255,176,32,.13);color:var(--warn)}
  .t-bad{background:rgba(255,107,107,.13);color:var(--bad)}
  .t-mut{background:rgba(159,176,195,.1);color:var(--tx2)}
  .empty{padding:34px 16px;text-align:center;color:var(--tx3);font-size:12.5px}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:150px}
  .col h4{margin:0 0 10px;font-size:12.5px;color:var(--tx2);display:flex;gap:7px;align-items:center}
  .col h4 .cnt{color:var(--tx3);font-weight:400}
  .ocard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px}
  .ocard .c{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
  .ocard .m{font-size:11px;color:var(--tx3);margin-top:3px}
  .ocard .a{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .modal{position:fixed;inset:0;background:rgba(4,7,11,.72);display:none;align-items:center;
    justify-content:center;z-index:100;padding:20px}
  .modal.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:430px;padding:20px;max-height:88vh;overflow:auto}
  .sheet h3{margin:0 0 16px;font-size:16px}
  .f{margin-bottom:13px}
  .f label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
  .f input,.f select{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--tx);border-radius:8px;padding:9px 11px;font-size:13.5px}
  .f input:focus,.f select:focus{outline:0;border-color:var(--acc)}
  .f .hint{font-size:11px;color:var(--tx3);margin-top:4px}
  .mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 18px;
    font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{background:rgba(76,201,240,.05);border:1px solid rgba(76,201,240,.2);border-radius:9px;
    padding:10px 14px;font-size:12px;color:var(--tx2);margin-bottom:18px}
  footer{border-top:1px solid var(--line);padding:20px 0;color:var(--tx3);font-size:11.5px}
  @media(max-width:820px){.grid2,.board{grid-template-columns:1fr}.sub{display:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">小店主 <span>·</span> 进销存管理台</div>
      <div class="sub">Demo · 数据存在本机浏览器</div>
      <div class="acts">
        <button class="btn" data-act="sample">载入示例数据</button>
        <button class="btn" data-act="export-json">导出备份</button>
        <button class="btn" data-act="export-csv">导出对账表</button>
        <button class="btn" data-act="import">导入备份</button>
        <button class="btn d" data-act="clear">清空</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-act="tab" data-tab="dash">概览</button>
      <button class="tab" data-act="tab" data-tab="products">商品与库存</button>
      <button class="tab" data-act="tab" data-tab="moves">出入库流水</button>
      <button class="tab" data-act="tab" data-tab="orders">订单看板</button>
    </div>
  </div>
</header>

<main class="wrap"><div id="view"></div></main>

<footer class="wrap">
  这是作品集里的可交互 Demo：库存自动扣减、低库存预警、订单状态流转、一键导出对账表。数据仅保存在你自己的浏览器里，可随时清空。
</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filein" accept=".json" style="display:none">

<script>
(function(){
'use strict';
/* ───────── 数据层 ───────── */
var KEY = 'fde_inventory_demo_v1';
function empty(){ return { products:[], moves:[], orders:[], seq:1 }; }
var db = load();
function load(){
  try { var r = localStorage.getItem(KEY); if(r){ var d = JSON.parse(r); d.products=d.products||[]; d.moves=d.moves||[]; d.orders=d.orders||[]; d.seq=d.seq||1; return d; } }
  catch(e){}
  return empty();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function uid(){ return Date.now().toString(36) + (db.seq++).toString(36); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function money(n){ n = Number(n)||0; return '¥' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ───────── 业务查询 ───────── */
function productById(id){ for(var i=0;i<db.products.length;i++) if(db.products[i].id===id) return db.products[i]; return null; }
function orderById(id){ for(var i=0;i<db.orders.length;i++) if(db.orders[i].id===id) return db.orders[i]; return null; }
function lowStock(){ return db.products.filter(function(p){ return p.stock <= (p.safety||0); }); }
function stockValue(){ return db.products.reduce(function(s,p){ return s + p.stock*(p.price||0); }, 0); }
function monthOf(d){ return String(d||'').slice(0,7); }
function salesThisMonth(){
  var m = monthOf(today()), sum = 0;
  db.orders.forEach(function(o){ if(o.status!=='cancelled' && monthOf(o.date)===m) sum += o.qty*(o.price||0); });
  return sum;
}
function openOrders(){ return db.orders.filter(function(o){ return o.status==='pending'||o.status==='shipped'; }).length; }

/* ───────── 业务动作 ───────── */
function addProduct(p){ db.products.push({ id:uid(), name:p.name, sku:p.sku, price:+p.price||0, stock:+p.stock||0, safety:+p.safety||0 }); save(); render(); toast('已新增商品：'+p.name); }
function delProduct(id){
  var used = db.moves.some(function(m){return m.productId===id;}) || db.orders.some(function(o){return o.productId===id;});
  if(used){ toast('该商品已有流水或订单，不能删除（保留历史账）'); return; }
  db.products = db.products.filter(function(p){ return p.id!==id; }); save(); render(); toast('已删除');
}
function addMove(productId, type, qty, note){
  var p = productById(productId); if(!p) return;
  qty = Math.abs(+qty||0); if(!qty){ toast('数量必须大于 0'); return; }
  if(type==='out' && qty > p.stock){ toast('库存不足：当前只有 '+p.stock+' 件'); return; }
  p.stock += (type==='in' ? qty : -qty);
  db.moves.unshift({ id:uid(), productId:productId, type:type, qty:qty, note:note||'', date:today() });
  save(); render(); toast((type==='in'?'入库':'出库')+' '+qty+' 件，库存现为 '+p.stock);
}
function addOrder(customer, productId, qty){
  var p = productById(productId); if(!p) return;
  qty = Math.abs(+qty||0); if(!qty){ toast('数量必须大于 0'); return; }
  db.orders.unshift({ id:uid(), customer:customer, productId:productId, qty:qty,
    price:p.price||0, status:'pending', date:today() });
  save(); render(); toast('订单已创建（待处理）');
}
/* 关键业务规则：发货才扣库存，且库存不足不放行 */
function shipOrder(id){
  var o = orderById(id), p = productById(o.productId);
  if(!p){ toast('商品已被删除'); return; }
  if(o.qty > p.stock){ toast('库存不足，无法发货：需要 '+o.qty+' 件，库存仅 '+p.stock+' 件'); return; }
  p.stock -= o.qty;
  db.moves.unshift({ id:uid(), productId:p.id, type:'out', qty:o.qty, note:'订单发货 '+o.customer, date:today() });
  o.status = 'shipped'; save(); render(); toast('已发货，库存自动扣减 '+o.qty+' 件');
}
function completeOrder(id){ var o=orderById(id); if(!o) return; o.status='completed'; save(); render(); toast('订单已完成'); }
function cancelOrder(id){
  var o = orderById(id); if(!o) return;
  if(o.status==='shipped'){ toast('已发货的订单不能直接取消，请先做退货入库'); return; }
  o.status='cancelled'; save(); render(); toast('订单已取消');
}

/* ───────── 示例数据 ───────── */
function loadSample(){
  db = empty(); db.seq = 1;
  function P(name,sku,price,stock,safety){ var id=uid(); db.products.push({id:id,name:name,sku:sku,price:price,stock:stock,safety:safety}); return id; }
  var a = P('纯棉圆领T恤','TS-001',79,42,10);
  var b = P('牛仔直筒裤','DN-002',159,8,10);
  var c = P('帆布托特包','BG-003',49,25,8);
  var d = P('棒球帽','CP-004',39,3,6);
  db.moves = [
    { id:uid(), productId:a, type:'in',  qty:50, note:'首次进货', date:today() },
    { id:uid(), productId:b, type:'in',  qty:20, note:'首次进货', date:today() },
    { id:uid(), productId:c, type:'in',  qty:30, note:'首次进货', date:today() },
    { id:uid(), productId:d, type:'in',  qty:10, note:'首次进货', date:today() },
    { id:uid(), productId:a, type:'out', qty:8,  note:'门店零售', date:today() }
  ];
  db.orders = [
    { id:uid(), customer:'张姐', productId:b, qty:2, price:159, status:'pending',   date:today() },
    { id:uid(), customer:'小李', productId:c, qty:1, price:49,  status:'pending',   date:today() },
    { id:uid(), customer:'李叔', productId:d, qty:5, price:39,  status:'pending',   date:today() },
    { id:uid(), customer:'王阿姨', productId:a, qty:3, price:79, status:'shipped',  date:today() },
    { id:uid(), customer:'老陈', productId:a, qty:1, price:79,  status:'completed',date:today() }
  ];
  save(); render(); toast('示例数据已载入，去「订单看板」点「发货」试试');
}

/* ───────── 渲染 ───────── */
var tab = 'dash', moveFilter = 'all';
function render(){
  var v = document.getElementById('view');
  if(tab==='dash') v.innerHTML = viewDash();
  else if(tab==='products') v.innerHTML = viewProducts();
  else if(tab==='moves') v.innerHTML = viewMoves();
  else v.innerHTML = viewOrders();
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab')===tab);
}

function viewDash(){
  var low = lowStock(), h = '';
  if(!db.products.length && !db.moves.length && !db.orders.length){
    h += '<div class="box" style="border-color:#4b3fb8">'
       + '<h3>这个页面现在是空的<span class="cnt">第一次打开</span></h3>'
       + '<div style="padding:4px 2px 14px;line-height:1.75">'
       + '点下面的按钮会载入 <b>5 件商品 · 14 张订单 · 19 条出入库流水</b>，'
       + '10 秒就能看到这个系统完整跑起来的样子。<br>'
       + '你自己录的数据只存在这台电脑的浏览器里，不上传任何地方。'
       + '</div>'
       + '<button class="btn p" data-act="sample">▶ 载入示例数据看看</button>'
       + '</div>';
  }
  h += '<div class="note">演示路径：<b>商品与库存</b> 录入商品 → <b>订单看板</b> 新建订单并点「发货」→ 库存自动扣减 + 生成出库流水 → 这里出现低库存预警。</div>';
  h += '<div class="kpis">';
  h += '<div class="kpi acc"><b>'+money(stockValue())+'</b><span>库存金额</span></div>';
  h += '<div class="kpi ok"><b>'+money(salesThisMonth())+'</b><span>本月销售额（不含已取消）</span></div>';
  h += '<div class="kpi'+(low.length?' warn':'')+'"><b>'+low.length+'</b><span>低库存商品（≤安全库存）</span></div>';
  h += '<div class="kpi"><b>'+openOrders()+'</b><span>未完结订单</span></div>';
  h += '</div>';
  h += '<div class="grid2">';
  h += '<div class="box"><h3>低库存预警<span class="cnt">'+low.length+' 项</span></h3>';
  if(!low.length) h += '<div class="empty">暂无预警。把某件商品的安全库存调高，或发货试试。</div>';
  else {
    h += '<table><thead><tr><th>商品</th><th>规格</th><th class="num">当前库存</th><th class="num">安全库存</th><th>状态</th></tr></thead><tbody>';
    low.forEach(function(p){
      var out = p.stock<=0;
      h += '<tr><td>'+esc(p.name)+'</td><td class="num">'+esc(p.sku)+'</td><td class="num">'+p.stock+'</td><td class="num">'+(p.safety||0)+'</td>'
         + '<td>'+(out?'<span class="tag t-bad">已缺货</span>':'<span class="tag t-warn">需补货</span>')+'</td></tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div>';
  h += '<div class="box"><h3>最近出入库<span class="cnt">最新 6 条</span></h3>';
  if(!db.moves.length) h += '<div class="empty">还没有流水。</div>';
  else {
    h += '<table><thead><tr><th>日期</th><th>商品</th><th>类型</th><th class="num">数量</th><th>备注</th></tr></thead><tbody>';
    db.moves.slice(0,6).forEach(function(m){
      var p = productById(m.productId);
      h += '<tr><td class="num">'+esc(m.date)+'</td><td>'+esc(p?p.name:'（已删除）')+'</td>'
         + '<td>'+(m.type==='in'?'<span class="tag t-ok">入库</span>':'<span class="tag t-mut">出库</span>')+'</td>'
         + '<td class="num">'+m.qty+'</td><td>'+esc(m.note)+'</td></tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div></div>';
  return h;
}

function viewProducts(){
  var h = '';
  h += '<div style="display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap">'
     + '<button class="btn p" data-act="new-product">+ 新增商品</button>'
     + '<button class="btn" data-act="new-move" data-type="in">入库</button>'
     + '<button class="btn" data-act="new-move" data-type="out">出库</button></div>';
  if(!db.products.length) return h + '<div class="box"><div class="empty">还没有商品。点「新增商品」或右上角「载入示例数据」。</div></div>';
  h += '<div class="box"><table><thead><tr><th>商品</th><th>规格</th><th class="num">单价</th><th class="num">库存</th>'
     + '<th class="num">安全库存</th><th class="num">库存金额</th><th>状态</th><th></th></tr></thead><tbody>';
  db.products.forEach(function(p){
    var st = p.stock<=0 ? '<span class="tag t-bad">缺货</span>'
           : (p.stock<=(p.safety||0) ? '<span class="tag t-warn">偏低</span>' : '<span class="tag t-ok">正常</span>');
    h += '<tr><td>'+esc(p.name)+'</td><td class="num">'+esc(p.sku)+'</td>'
       + '<td class="num">'+money(p.price)+'</td><td class="num"><b>'+p.stock+'</b></td>'
       + '<td class="num">'+(p.safety||0)+'</td><td class="num">'+money(p.stock*(p.price||0))+'</td>'
       + '<td>'+st+'</td>'
       + '<td style="text-align:right;white-space:nowrap">'
       + '<button class="btn s" data-act="new-move" data-type="in" data-id="'+p.id+'">入</button> '
       + '<button class="btn s" data-act="new-move" data-type="out" data-id="'+p.id+'">出</button> '
       + '<button class="btn s d" data-act="del-product" data-id="'+p.id+'">删</button></td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function viewMoves(){
  var h = '';
  h += '<div style="display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap">'
     + '<button class="btn" data-act="new-move" data-type="in">+ 入库</button>'
     + '<button class="btn" data-act="new-move" data-type="out">+ 出库</button>'
     + '<button class="btn'+(moveFilter==='all'?' p':'')+'" data-act="filter" data-f="all">全部</button>'
     + '<button class="btn'+(moveFilter==='in'?' p':'')+'" data-act="filter" data-f="in">只看入库</button>'
     + '<button class="btn'+(moveFilter==='out'?' p':'')+'" data-act="filter" data-f="out">只看出库</button></div>';
  var list = db.moves.filter(function(m){ return moveFilter==='all' || m.type===moveFilter; });
  if(!list.length) return h + '<div class="box"><div class="empty">没有符合条件的流水。</div></div>';
  h += '<div class="box"><table><thead><tr><th>日期</th><th>商品</th><th>类型</th><th class="num">数量</th><th>备注</th></tr></thead><tbody>';
  list.forEach(function(m){
    var p = productById(m.productId);
    h += '<tr><td class="num">'+esc(m.date)+'</td><td>'+esc(p?p.name:'（已删除）')+'</td>'
       + '<td>'+(m.type==='in'?'<span class="tag t-ok">入库</span>':'<span class="tag t-mut">出库</span>')+'</td>'
       + '<td class="num">'+(m.type==='in'?'+':'-')+m.qty+'</td><td>'+esc(m.note)+'</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function viewOrders(){
  var cols = [['pending','待处理'],['shipped','已发货'],['completed','已完成']];
  var others = db.orders.filter(function(o){ return o.status==='cancelled'; });
  var h = '<div style="display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap">'
        + '<button class="btn p" data-act="new-order">+ 新建订单</button></div>';
  h += '<div class="board">';
  cols.forEach(function(c){
    var list = db.orders.filter(function(o){ return o.status===c[0]; });
    h += '<div class="col"><h4>'+c[1]+'<span class="cnt">'+list.length+'</span></h4>';
    if(!list.length) h += '<div class="empty" style="padding:18px 0">空</div>';
    list.forEach(function(o){
      var p = productById(o.productId);
      var lack = (c[0]==='pending' && p && p.stock < o.qty);
      h += '<div class="ocard"><div class="c"><b>'+esc(o.customer)+'</b><span class="num">'+money(o.qty*(o.price||0))+'</span></div>'
         + '<div class="m">'+esc(p?p.name:'（商品已删）')+' × '+o.qty+' · '+esc(o.date)
         + (lack?' · <span style="color:var(--warn)">库存不足</span>':'')+'</div><div class="a">';
      if(c[0]==='pending'){
        h += '<button class="btn s p" data-act="ship" data-id="'+o.id+'">发货</button>'
           + '<button class="btn s d" data-act="cancel" data-id="'+o.id+'">取消</button>';
      } else if(c[0]==='shipped'){
        h += '<button class="btn s p" data-act="complete" data-id="'+o.id+'">完成</button>';
      } else {
        h += '<span class="tag t-mut">已归档</span>';
      }
      h += '</div></div>';
    });
    h += '</div>';
  });
  h += '</div>';
  if(others.length){
    h += '<div class="box" style="margin-top:16px"><h3>已取消<span class="cnt">'+others.length+'</span></h3><table><tbody>';
    others.forEach(function(o){
      var p = productById(o.productId);
      h += '<tr><td>'+esc(o.customer)+'</td><td>'+esc(p?p.name:'—')+' × '+o.qty+'</td><td class="num">'+esc(o.date)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  return h;
}

/* ───────── 弹窗表单 ───────── */
var modal = document.getElementById('modal'), sheet = document.getElementById('sheet');
function closeModal(){ modal.classList.remove('on'); sheet.innerHTML=''; }
function openModal(html){ sheet.innerHTML = html; modal.classList.add('on');
  var f = sheet.querySelector('input,select'); if(f) f.focus(); }
function opts(sel){
  return db.products.map(function(p){
    return '<option value="'+p.id+'"'+(sel===p.id?' selected':'')+'>'+esc(p.name)+'（库存 '+p.stock+'）</option>';
  }).join('');
}
function formProduct(){
  if(!db.products.length) return toast('请先新增至少一个商品');
  openModal('<h3>新增商品</h3><form data-form="product">'
    + '<div class="f"><label>商品名称</label><input name="name" required placeholder="例：纯棉圆领T恤"></div>'
    + '<div class="f"><label>规格 / 货号</label><input name="sku" placeholder="例：TS-001"></div>'
    + '<div class="f"><label>单价（元）</label><input name="price" type="number" min="0" step="0.01" value="0"></div>'
    + '<div class="f"><label>期初库存</label><input name="stock" type="number" min="0" step="1" value="0"></div>'
    + '<div class="f"><label>安全库存（低于它自动预警）</label><input name="safety" type="number" min="0" step="1" value="0">'
    + '<div class="hint">建议填「补货要花的天数 × 日均销量」</div></div>'
    + '<div class="mfoot"><button type="button" class="btn" data-act="close">取消</button>'
    + '<button class="btn p" type="submit">保存</button></div></form>');
}
function formMove(type, id){
  if(!db.products.length) return toast('请先新增至少一个商品');
  var label = type==='in' ? '入库' : '出库';
  openModal('<h3>商品'+label+'</h3><form data-form="move" data-type="'+type+'">'
    + '<div class="f"><label>商品</label><select name="productId">'+opts(id)+'</select></div>'
    + '<div class="f"><label>数量</label><input name="qty" type="number" min="1" step="1" value="1" required></div>'
    + '<div class="f"><label>备注</label><input name="note" placeholder="例：门店零售 / 补货"></div>'
    + '<div class="mfoot"><button type="button" class="btn" data-act="close">取消</button>'
    + '<button class="btn p" type="submit">确认'+label+'</button></div></form>');
}
function formOrder(){
  if(!db.products.length) return toast('请先新增至少一个商品');
  openModal('<h3>新建订单</h3><form data-form="order">'
    + '<div class="f"><label>客户</label><input name="customer" required placeholder="例：张姐 / 微信号"></div>'
    + '<div class="f"><label>商品</label><select name="productId">'+opts()+'</select></div>'
    + '<div class="f"><label>数量</label><input name="qty" type="number" min="1" step="1" value="1" required></div>'
    + '<div class="f"><div class="hint">订单先进入「待处理」，点发货时才扣库存（这是有意设计的业务规则）。</div></div>'
    + '<div class="mfoot"><button type="button" class="btn" data-act="close">取消</button>'
    + '<button class="btn p" type="submit">创建订单</button></div></form>');
}

/* ───────── 导出 / 导入 ───────── */
function dl(name, text, mime){
  var b = new Blob([text], {type:mime||'application/json'});
  var u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
}
function exportJson(){ dl('进销存备份-'+today()+'.json', JSON.stringify(db, null, 2)); toast('已导出备份'); }
function exportCsv(){
  var rows = [['日期','类型','商品','规格','数量','单价','金额','备注']];
  db.moves.slice().reverse().forEach(function(m){
    var p = productById(m.productId);
    rows.push([m.date, m.type==='in'?'入库':'出库', p?p.name:'（已删除）', p?p.sku:'', m.qty,
      p?(p.price||0):'', (m.qty*(p?p.price||0:0)).toFixed(2), m.note||'']);
  });
  var csv = '\ufeff' + rows.map(function(r){
    return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\r\n');
  dl('对账表-'+today()+'.csv', csv, 'text/csv'); toast('已导出对账表（可用 Excel 打开）');
}
function doImport(){
  document.getElementById('filein').click();
}

/* ───────── 事件 ───────── */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  var act = t.getAttribute('data-act');
  if(act==='close') return closeModal();
  if(act==='tab'){ tab = t.getAttribute('data-tab'); render(); return; }
  if(act==='filter'){ moveFilter = t.getAttribute('data-f'); render(); return; }
  if(act==='new-product') return formProduct();
  if(act==='new-move') return formMove(t.getAttribute('data-type'), t.getAttribute('data-id'));
  if(act==='new-order') return formOrder();
  if(act==='ship') return shipOrder(t.getAttribute('data-id'));
  if(act==='complete') return completeOrder(t.getAttribute('data-id'));
  if(act==='cancel') return cancelOrder(t.getAttribute('data-id'));
  if(act==='del-product') return delProduct(t.getAttribute('data-id'));
  if(act==='sample') return loadSample();
  if(act==='export-json') return exportJson();
  if(act==='export-csv') return exportCsv();
  if(act==='import') return doImport();
  if(act==='clear'){
    if(confirm('确定清空所有商品、流水与订单？此操作不可撤销。')){ db = empty(); save(); tab='dash'; render(); toast('已清空'); }
    return;
  }
});
document.addEventListener('submit', function(e){
  var f = e.target; if(!f.matches('form[data-form]')) return;
  e.preventDefault();
  var d = new FormData(f), kind = f.getAttribute('data-form');
  if(kind==='product'){
    if(!String(d.get('name')||'').trim()) return toast('请填写商品名称');
    addProduct({ name:String(d.get('name')).trim(), sku:String(d.get('sku')||'').trim(),
      price:d.get('price'), stock:d.get('stock'), safety:d.get('safety') });
  } else if(kind==='move'){
    addMove(d.get('productId'), f.getAttribute('data-type'), d.get('qty'), String(d.get('note')||'').trim());
  } else if(kind==='order'){
    if(!String(d.get('customer')||'').trim()) return toast('请填写客户');
    addOrder(String(d.get('customer')).trim(), d.get('productId'), d.get('qty'));
  }
  closeModal();
});
modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
document.getElementById('filein').addEventListener('change', function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.products)) throw new Error('bad');
      db = { products:d.products||[], moves:d.moves||[], orders:d.orders||[], seq:d.seq||1 };
      save(); render(); toast('导入成功');
    }catch(err){ toast('导入失败：文件格式不对'); }
  };
  r.readAsText(f); e.target.value='';
});
var toastTimer;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2400);
}
render();
})();
</script>
